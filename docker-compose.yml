version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medisync-postgres
    restart: always
    environment:
      POSTGRES_USER: medisync
      POSTGRES_PASSWORD: medisync_secret
      POSTGRES_DB: medisync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # n8n preparado para cuando se active la automatización de recepción y WhatsApp
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: medisync-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  postgres_data:
  n8n_data:
